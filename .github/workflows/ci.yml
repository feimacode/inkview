name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      - name: Upload screenshots
        if: always() && matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: dist-test/*.png
          if-no-files-found: ignore
      - name: Cold npx start (empty cache, under 15 s)
        if: matrix.node == 22
        run: |
          npm pack -w @feimacode/inkview
          start=$(date +%s)
          npx --cache "$RUNNER_TEMP/empty-npm-cache" -y --package="$PWD/$(ls feimacode-inkview-*.tgz)" inkview --version
          took=$(( $(date +%s) - start ))
          echo "cold npx took ${took}s"
          test "$took" -lt 15
      - name: Gallery builds and shows every component
        if: matrix.node == 22
        run: npm run build:gallery && node scripts/gallery-check.mjs
      - run: npx -y @fission-ai/openspec@1.16.0 validate --all --strict
        if: matrix.node == 22
        env:
          OPENSPEC_TELEMETRY: "0"

  stdio-windows:
    name: Stdio (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/stdio-test.mjs

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: docker build -t inkview:ci .
      - run: docker run -d --name inkview -p 8080:8080 inkview:ci
      - name: Smoke test against the container
        run: |
          for i in $(seq 1 20); do curl -fs localhost:8080/healthz && break; sleep 1; done
          MCP_URL=http://localhost:8080/mcp node scripts/smoke-test.mjs
      - if: always()
        run: docker logs inkview
