name: Gallery

# Publishes the component gallery (every example, light and dark) to GitHub Pages.
# One-time setup: Settings → Pages → Source: GitHub Actions.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "dev/**", "package-lock.json"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:gallery
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-dev/gallery
      - id: deployment
        uses: actions/deploy-pages@v4
